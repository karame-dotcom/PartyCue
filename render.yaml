services:
  - type: web
    name: partycue
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/rooms/HEALTH
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: GEMINI_API_KEY
        sync: false
